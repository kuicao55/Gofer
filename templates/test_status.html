<div id="test-status"
     {% if running %}hx-get="/tests/status?id={{ id }}" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
  <div class="health-row"><span class="health-key">请求</span><span class="health-val mono">{{ id }}</span></div>
  <div class="health-row"><span class="health-key">状态</span><span class="badge {{ status_class }}">{{ status_text }}</span></div>
  <div class="health-row"><span class="health-key">耗时</span><span class="health-val mono">{{ duration }}</span></div>
  {% if !summary.is_empty() %}
  <div class="req-ok" style="margin-top:10px">{{ summary }}</div>
  {% endif %}
  {% if !error.is_empty() %}
  <div class="req-error" style="margin-top:10px">{{ error }}</div>
  {% endif %}
  {% if running %}
  <p class="form-note" style="margin-top:10px">执行中，页面会自动刷新。</p>
  {% endif %}
</div>

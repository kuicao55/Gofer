[package]
name = "gofer"
version = "0.3.2"
edition = "2021"
description = "Local action service: WeChat / Xiaohongshu notifications and Maoyan ticket locking"
license = "MIT"

[[bin]]
name = "gofer"
path = "src/main.rs"

[lib]
name = "gofer"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "compression-gzip", "trace"] }
askama = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

anyhow = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
